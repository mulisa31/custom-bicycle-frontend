<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Orders | Admin | CBBS</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      .orders-container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1.5rem;
      }
      .page-header {
        margin-bottom: 1.5rem;
      }
      .page-header h1 {
        font-size: 1.8rem;
        color: #1a2634;
      }
      .table-wrap {
        background: #fff;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        padding: 0.8rem 1rem;
        text-align: left;
        border-bottom: 1px solid #edf2f7;
      }
      th {
        background: #f8fafc;
        font-weight: 600;
        color: #2d3f5e;
      }
      .status-badge {
        padding: 0.25rem 0.8rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: capitalize;
      }
      .status-badge.pending {
        background: #fff3cd;
        color: #856404;
      }
      .status-badge.assembling {
        background: #cce5ff;
        color: #004085;
      }
      .status-badge.ready {
        background: #d1ecf1;
        color: #0c5460;
      }
      .status-badge.shipped {
        background: #d4edda;
        color: #155724;
      }
      .status-badge.completed {
        background: #d4edda;
        color: #155724;
        font-weight: 700;
      }
      .btn-view {
        background: #cce5ff;
        color: #004085;
        border: none;
        padding: 0.4rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .loading {
        text-align: center;
        padding: 2rem;
        color: #6c7a8a;
      }
      /* align modal table cells left */
      #orderItemsModal table th,
      #orderItemsModal table td {
        text-align: left !important;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div id="header-placeholder"></div>
    </header>
    <hr />
    <main>
      <div class="orders-container">
        <div class="page-header">
          <h1><i class="fas fa-receipt"></i> All Orders</h1>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Status</th>
                <th>Date</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr>
                <td colspan="6" class="loading">Loading orders...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <hr />
    <div id="footer-placeholder"></div>

    <script src="assets/js/load-components.js"></script>
    <script>
      const API_BASE = "https://custom-bicycle-system-backend.onrender.com/api";
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user") || "null");

      // only admin can open this page
      if (!token || !user || user.role !== "admin") {
        window.location.href = "login.html";
      }

      let allOrders = [];

      // fetch with auth
      async function fetchWithAuth(endpoint) {
        const res = await fetch(`${API_BASE}${endpoint}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      }

      // load all orders into the table
      async function loadOrders() {
        const tbody = document.getElementById("ordersBody");
        try {
          const orders = await fetchWithAuth("/orders/all");
          allOrders = orders;
          if (orders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="loading">No orders found.</td></tr>`;
            return;
          }
          tbody.innerHTML = orders
            .map((order) => {
              const customer = order.User
                ? order.User.name
                : `User #${order.userId}`;
              const status = order.status || "pending";
              return `
            <tr>
              <td><strong>#${order.id}</strong></td>
              <td>${customer}</td>
              <td>R${Number(order.totalPrice || 0).toFixed(2)}</td>
              <td><span class="status-badge ${status}">${status}</span></td>
              <td>${order.createdAt ? new Date(order.createdAt).toLocaleDateString() : "N/A"}</td>
              <td><button class="btn-view" onclick="viewOrderItems(${order.id})">View Items</button></td>
            </tr>
          `;
            })
            .join("");
        } catch (error) {
          tbody.innerHTML = `<tr><td colspan="6" class="loading">Failed to load orders.</td></tr>`;
        }
      }

      // show order items grouped by bicycle
      function viewOrderItems(orderId) {
        const order = allOrders.find((o) => o.id === orderId);
        if (!order) return;

        const existingModal = document.getElementById("orderItemsModal");
        if (existingModal) existingModal.remove();

        const modal = document.createElement("div");
        modal.id = "orderItemsModal";
        modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
      `;

        // group by bicycleGroupId
        const bikeGroups = {};
        (order.OrderItems || []).forEach((item) => {
          const groupId = item.bicycleGroupId || "unknown";
          if (!bikeGroups[groupId]) bikeGroups[groupId] = [];
          bikeGroups[groupId].push(item);
        });

        let modalBody = `
        <h3 style="margin-top:0;color:#1a2634;">Order #${order.id} Items</h3>
      `;

        let fullTotal = 0;

        Object.keys(bikeGroups).forEach((groupId, index) => {
          const items = bikeGroups[groupId];
          let bikeSubtotal = 0;

          items.forEach((item) => {
            bikeSubtotal +=
              Number(item.Component.unitPrice) * (item.quantity || 1);
          });
          fullTotal += bikeSubtotal;

          modalBody += `
          <h4 style="margin:15px 0 5px;color:#3f705f;">Bike ${index + 1} <small style="font-weight:400;">(ID: ${groupId.substring(0, 8)})</small></h4>
          <table style="width:100%;border-collapse:collapse;font-size:0.9rem;">
            <thead>
              <tr style="border-bottom:2px solid #e2e8f0;">
                <th style="text-align:left;padding:8px;">Category</th>
                <th style="text-align:left;padding:8px;">Component</th>
                <th style="text-align:left;padding:8px;">Price</th>
              </tr>
            </thead>
            <tbody>
        `;

          items.forEach((item) => {
            modalBody += `
            <tr style="border-bottom:1px solid #f0f2f5;">
              <td style="padding:8px;">${item.Component ? item.Component.category || "General" : "N/A"}</td>
              <td style="padding:8px;">${item.Component ? item.Component.name : "Unknown"}</td>
              <td style="padding:8px;">R${item.Component ? Number(item.Component.unitPrice).toFixed(2) : "0.00"}</td>
            </tr>
          `;
          });

          modalBody += `
            </tbody>
          </table>
        `;

          if (Object.keys(bikeGroups).length > 1) {
            modalBody += `
            <div style="text-align:right;font-weight:600;margin-top:5px;">Subtotal: R${bikeSubtotal.toFixed(2)}</div>
          `;
          }
        });

        modalBody += `
        <div style="margin-top:20px;padding:15px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;text-align:right;">
          <span style="font-size:0.9rem;color:#2d3f5e;font-weight:600;">Full Total</span>
          <span style="font-size:1.5rem;font-weight:700;color:#1a2634;margin-left:10px;">R${fullTotal.toFixed(2)}</span>
        </div>
        <div style="margin-top:15px;text-align:right;">
          <button onclick="document.getElementById('orderItemsModal').remove()" style="padding:8px 20px;background:#3f705f;color:#fff;border:none;border-radius:5px;cursor:pointer;">Close</button>
        </div>
      `;

        modal.innerHTML = `<div style="background:#fff;padding:25px;border-radius:10px;max-width:650px;width:90%;max-height:80vh;overflow-y:auto;">${modalBody}</div>`;
        document.body.appendChild(modal);

        modal.addEventListener("click", function (e) {
          if (e.target === this) this.remove();
        });
      }

      document.addEventListener("DOMContentLoaded", loadOrders);
    </script>
  </body>
</html>
