<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.0.0/uicons-regular-straight/css/uicons-regular-straight.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <style>
      .cb-admin-section {
        width: 100% !important;
        min-height: 80vh !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        padding: 60px 20px !important;
        background: #f8f9f7 !important;
        box-sizing: border-box !important;
      }
      .cb-admin-card {
        width: 100% !important;
        max-width: 460px !important;
        padding: 42px !important;
        background: #ffffff !important;
        border: 1px solid #e6e9e4 !important;
        border-radius: 16px !important;
        box-shadow: 0 12px 40px rgba(30, 42, 35, 0.08) !important;
        box-sizing: border-box !important;
      }
      .cb-admin-title {
        margin: 0 !important;
        text-align: center !important;
        color: #1f2d27 !important;
        font-size: 28px !important;
        font-weight: 700 !important;
      }
      .cb-admin-subtitle {
        margin: 8px 0 28px !important;
        text-align: center !important;
        color: #737b76 !important;
        font-size: 14px !important;
      }
      .cb-admin-field {
        margin-bottom: 16px !important;
      }
      .cb-admin-field label {
        display: block !important;
        margin-bottom: 6px !important;
        color: #29352f !important;
        font-size: 14px !important;
        font-weight: 600 !important;
      }
      .cb-admin-field input {
        width: 100% !important;
        height: 48px !important;
        padding: 0 14px !important;
        border: 1px solid #d9ded9 !important;
        border-radius: 8px !important;
        background: #fbfcfb !important;
        font-size: 14px !important;
        outline: none !important;
        box-sizing: border-box !important;
      }
      .cb-admin-field input:focus {
        border-color: #4d806f !important;
        box-shadow: 0 0 0 3px rgba(77, 128, 111, 0.12) !important;
      }
      .cb-admin-field input::placeholder {
        color: #a0a7a3 !important;
      }
      .cb-admin-button {
        width: 100% !important;
        height: 52px !important;
        border: none !important;
        border-radius: 8px !important;
        background: #3f705f !important;
        color: #ffffff !important;
        font-size: 15px !important;
        font-weight: 600 !important;
        cursor: pointer !important;
        transition: background 0.2s ease !important;
      }
      .cb-admin-button:hover {
        background: #315b4d !important;
      }
      .cb-admin-error {
        background: #fde8e8;
        color: #a94442;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 16px;
        display: none;
        font-size: 14px;
      }
      .cb-admin-success {
        background: #d4edda;
        color: #155724;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 16px;
        display: none;
        font-size: 14px;
        text-align: center;
        font-weight: 600;
      }
      .cb-admin-success i {
        margin-right: 8px;
      }
      @media (max-width: 576px) {
        .cb-admin-card {
          padding: 30px 20px !important;
        }
        .cb-admin-title {
          font-size: 24px !important;
        }
      }
    </style>
    <title>Add Admin | CBBS</title>
  </head>
  <body>
    <header class="header">
      <div id="header-placeholder"></div>
    </header>
    <hr />
    <main class="main">
      <section class="cb-admin-section">
        <div class="cb-admin-card">
          <h1 class="cb-admin-title">Create Admin</h1>
          <p class="cb-admin-subtitle">Add a new administrator to the system</p>

          <div id="admin-error" class="cb-admin-error"></div>
          <div id="admin-success" class="cb-admin-success">
            <i class="fas fa-check-circle"></i> Admin successfully added!
          </div>

          <form id="adminForm">
            <div class="cb-admin-field">
              <label for="admin-name">Full Name *</label>
              <input
                type="text"
                id="admin-name"
                placeholder="Enter full name"
                required
              />
            </div>

            <div class="cb-admin-field">
              <label for="admin-email">Email *</label>
              <input
                type="email"
                id="admin-email"
                placeholder="Enter email address"
                required
              />
            </div>

            <div class="cb-admin-field">
              <label for="admin-password">Password *</label>
              <input
                type="password"
                id="admin-password"
                placeholder="Enter password"
                required
              />
            </div>

            <div class="cb-admin-field">
              <label for="admin-confirm">Confirm Password *</label>
              <input
                type="password"
                id="admin-confirm"
                placeholder="Re-enter password"
                required
              />
            </div>

            <div class="cb-admin-field">
              <label for="admin-contact">Phone *</label>
              <input
                type="tel"
                id="admin-contact"
                placeholder="Enter your cellphone number"
                required
              />
            </div>

            <button type="submit" class="cb-admin-button">Create Admin</button>
          </form>
        </div>
      </section>
      <hr />
    </main>

    <footer class="footer container">
      <div id="footer-placeholder"></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/load-components.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // check if the user is an admin; if not, send them away
        const user = JSON.parse(localStorage.getItem("user"));
        const token = localStorage.getItem("token");

        if (!token || !user || user.role !== "admin") {
          window.location.href = "index.html";
          return;
        }

        const form = document.getElementById("adminForm");
        const errorDiv = document.getElementById("admin-error");
        const successDiv = document.getElementById("admin-success");

        successDiv.style.display = "none";

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          errorDiv.style.display = "none";
          successDiv.style.display = "none";

          const name = document.getElementById("admin-name").value.trim();
          const email = document.getElementById("admin-email").value.trim();
          const password = document.getElementById("admin-password").value;
          const confirm = document.getElementById("admin-confirm").value;
          const contact = document.getElementById("admin-contact").value.trim();

          if (!name || !email || !password || !contact) {
            errorDiv.textContent = "All fields are required.";
            errorDiv.style.display = "block";
            return;
          }

          if (password !== confirm) {
            errorDiv.textContent = "Passwords do not match.";
            errorDiv.style.display = "block";
            return;
          }

          try {
            const headers = { "Content-Type": "application/json" };
            if (token) headers["Authorization"] = `Bearer ${token}`;

            // call the AP on Render
            const response = await fetch(
              "https://custom-bicycle-system-backend.onrender.com/api/auth/register",
              {
                method: "POST",
                headers: headers,
                body: JSON.stringify({
                  name: name,
                  email: email,
                  password: password,
                  contact: contact,
                  address: "Admin address",
                  role: "admin",
                }),
              },
            );

            const data = await response.json();

            if (response.ok) {
              // show success and clear the form
              successDiv.style.display = "block";
              form.reset();
            } else {
              errorDiv.textContent = data.error || "Failed to create admin.";
              errorDiv.style.display = "block";
            }
          } catch (error) {
            errorDiv.textContent = "Network error. Try again.";
            errorDiv.style.display = "block";
          }
        });
      });
    </script>
  </body>
</html>
