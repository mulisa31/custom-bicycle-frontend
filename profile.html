<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.0.0/uicons-regular-straight/css/uicons-regular-straight.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <title>My Profile | CBBS</title>
    <style>
      /* same as before */
      .profile-container {
        max-width: 700px;
        margin: 2rem auto;
        padding: 0 1.5rem;
      }
      .profile-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .profile-header h1 {
        font-size: 2rem;
        color: #1a2634;
        margin: 0;
      }
      .profile-header .role-badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        background: #eef3ef;
        color: #3f705f;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 8px;
      }
      .profile-card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }
      .profile-view-entry {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.9rem 0;
        border-bottom: 1px solid #f0f2f5;
      }
      .profile-view-entry:last-child {
        border-bottom: none;
      }
      .profile-view-entry .label {
        font-weight: 600;
        color: #2d3f5e;
        font-size: 0.95rem;
      }
      .profile-view-entry .value {
        color: #1a2634;
        font-size: 0.95rem;
        word-break: break-word;
      }
      .profile-actions {
        display: flex;
        gap: 1rem;
        margin-top: 1.5rem;
        justify-content: flex-end;
      }
      .btn-edit,
      .btn-cancel,
      .btn-save {
        padding: 0.6rem 1.5rem;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-family: inherit;
        font-size: 0.9rem;
        transition: background 0.2s;
      }
      .btn-edit {
        background: #3f705f;
        color: #fff;
      }
      .btn-edit:hover {
        background: #2f5a4c;
      }
      .btn-cancel {
        background: #e2e8f0;
        color: #2d3f5e;
      }
      .btn-cancel:hover {
        background: #d0d7e0;
      }
      .btn-save {
        background: #3f705f;
        color: #fff;
      }
      .btn-save:hover {
        background: #2f5a4c;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #2d3f5e;
        font-size: 0.9rem;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid #d9ded9;
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.95rem;
        background: #fff;
        color: #1a2634;
      }
      .form-group input:disabled {
        background: #f1f3f5;
        cursor: not-allowed;
        color: #6c7a8a;
      }
      .form-group input:focus,
      .form-group select:focus {
        border-color: #3f705f;
        outline: none;
      }
      .profile-message {
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 1rem;
        display: none;
        font-size: 14px;
      }
      .profile-message.success {
        display: block;
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .profile-message.error {
        display: block;
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .hidden {
        display: none !important;
      }
      @media (max-width: 500px) {
        .profile-view-entry {
          flex-direction: column;
          align-items: flex-start;
          gap: 4px;
        }
        .profile-actions {
          flex-direction: column;
        }
        .btn-edit,
        .btn-cancel,
        .btn-save {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div id="header-placeholder"></div>
    </header>
    <hr />

    <main class="main">
      <div class="profile-container">
        <div class="profile-header">
          <h1 id="profileHeading">My Profile</h1>
          <span class="role-badge" id="roleBadge"></span>
        </div>

        <div id="profileMessage" class="profile-message"></div>

        <!-- view mode -->
        <div class="profile-card" id="viewMode">
          <div id="profileEntries"></div>
          <div class="profile-actions">
            <button class="btn-edit" onclick="toggleEdit(true)">Edit</button>
          </div>
        </div>

        <!-- edit mode -->
        <div class="profile-card hidden" id="editMode">
          <form id="profileForm">
            <div class="form-group">
              <label for="editName">Full Name *</label>
              <input type="text" id="editName" required />
            </div>
            <div class="form-group">
              <label for="editEmail">Email Address (unchangeable)</label>
              <input type="email" id="editEmail" disabled />
            </div>
            <div class="form-group">
              <label for="editContact">Phone Number *</label>
              <input type="tel" id="editContact" required />
            </div>

            <!-- address fields only for customers -->
            <div id="addressGroup">
              <div class="form-group">
                <label for="editAddress">Street Address</label>
                <input type="text" id="editAddress" />
              </div>
              <div class="form-group">
                <label for="editProvince">Province</label>
                <input type="text" id="editProvince" />
              </div>
              <div class="form-group">
                <label for="editCity">City</label>
                <input type="text" id="editCity" />
              </div>
              <div class="form-group">
                <label for="editPostalCode">Postal Code</label>
                <input type="text" id="editPostalCode" />
              </div>
            </div>

            <div class="form-group">
              <label for="editPassword"
                >New Password (leave blank to keep current)</label
              >
              <input type="password" id="editPassword" />
            </div>

            <!-- preference only for customers -->
            <div class="form-group hidden" id="preferenceGroup">
              <label for="editPreference"
                >What type of bike do you want to build?</label
              >
              <select id="editPreference">
                <option value="">Select Bike Type</option>
                <option value="Road Bike">Road Bike</option>
                <option value="Mountain Bike">Mountain Bike</option>
                <option value="Hybrid">Hybrid</option>
                <option value="BMX">BMX</option>
                <option value="Electric">Electric Bike</option>
                <option value="Cruiser">Cruiser</option>
                <option value="Gravel">Gravel Bike</option>
                <option value="Track">Track Bike</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="profile-actions">
              <button
                type="button"
                class="btn-cancel"
                onclick="toggleEdit(false)"
              >
                Cancel
              </button>
              <button type="submit" class="btn-save">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <hr />
    <footer class="footer container">
      <div id="footer-placeholder"></div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/load-components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
      const API_BASE = "https://custom-bicycle-system-backend.onrender.com/api";
      const token = localStorage.getItem("token");
      let currentUser = null;

      function showMessage(text, type) {
        const el = document.getElementById("profileMessage");
        el.textContent = text;
        el.className = "profile-message " + type;
        setTimeout(() => {
          el.className = "profile-message";
          el.textContent = "";
        }, 4000);
      }

      function fetchWithAuth(endpoint, options = {}) {
        return fetch(`${API_BASE}${endpoint}`, {
          ...options,
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
            ...options.headers,
          },
        }).then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        });
      }

      function toggleEdit(showEdit) {
        if (showEdit) {
          document.getElementById("editName").value = currentUser.name || "";
          document.getElementById("editEmail").value = currentUser.email || "";
          document.getElementById("editContact").value =
            currentUser.contact || "";
          document.getElementById("editPassword").value = "";

          const isCustomer = currentUser.role === "customer";
          const addressGroup = document.getElementById("addressGroup");
          const preferenceGroup = document.getElementById("preferenceGroup");

          if (isCustomer) {
            addressGroup.classList.remove("hidden");
            preferenceGroup.classList.remove("hidden");
            document.getElementById("editAddress").value =
              currentUser.address || "";
            document.getElementById("editProvince").value =
              currentUser.province || "";
            document.getElementById("editCity").value = currentUser.city || "";
            document.getElementById("editPostalCode").value =
              currentUser.postalCode || "";
            document.getElementById("editPreference").value =
              currentUser.preference || "";
          } else {
            addressGroup.classList.add("hidden");
            preferenceGroup.classList.add("hidden");
          }

          document.getElementById("viewMode").classList.add("hidden");
          document.getElementById("editMode").classList.remove("hidden");
        } else {
          document.getElementById("viewMode").classList.remove("hidden");
          document.getElementById("editMode").classList.add("hidden");
        }
      }

      function renderProfileView() {
        const entriesDiv = document.getElementById("profileEntries");
        let html = "";

        html += `<div class="profile-view-entry"><span class="label">Full Name</span><span class="value">${currentUser.name || "-"}</span></div>`;
        html += `<div class="profile-view-entry"><span class="label">Email Address</span><span class="value">${currentUser.email || "-"}</span></div>`;
        html += `<div class="profile-view-entry"><span class="label">Phone Number</span><span class="value">${currentUser.contact || "-"}</span></div>`;

        if (currentUser.role === "customer") {
          html += `<div class="profile-view-entry"><span class="label">Street Address</span><span class="value">${currentUser.address || "-"}</span></div>`;
          html += `<div class="profile-view-entry"><span class="label">Province</span><span class="value">${currentUser.province || "-"}</span></div>`;
          html += `<div class="profile-view-entry"><span class="label">City</span><span class="value">${currentUser.city || "-"}</span></div>`;
          html += `<div class="profile-view-entry"><span class="label">Postal Code</span><span class="value">${currentUser.postalCode || "-"}</span></div>`;
          html += `<div class="profile-view-entry"><span class="label">Preferred Bike Type</span><span class="value">${currentUser.preference || "Not set"}</span></div>`;
        }

        entriesDiv.innerHTML = html;
        document.getElementById("profileHeading").textContent =
          `${currentUser.name || "User"}'s Profile`;
        document.getElementById("roleBadge").textContent =
          currentUser.role || "user";
      }

      async function loadProfile() {
        if (!token) {
          window.location.href = "login.html";
          return;
        }

        try {
          const freshUser = await fetchWithAuth("/users/profile");
          currentUser = freshUser;
          localStorage.setItem("user", JSON.stringify(freshUser));
          renderProfileView();
        } catch (error) {
          console.error("Error loading profile:", error);
          showMessage("Failed to load profile. Please try again.", "error");
        }
      }

      document
        .getElementById("profileForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const payload = {};
          const name = document.getElementById("editName").value.trim();
          const contact = document.getElementById("editContact").value.trim();
          const password = document.getElementById("editPassword").value;
          const preference = document.getElementById("editPreference").value;

          if (name) payload.name = name;
          if (contact) payload.contact = contact;
          if (password) payload.password = password;
          if (currentUser.role === "customer") {
            payload.preference = preference;
          }

          const isCustomer = currentUser.role === "customer";
          if (isCustomer) {
            payload.address = document
              .getElementById("editAddress")
              .value.trim();
            payload.province = document
              .getElementById("editProvince")
              .value.trim();
            payload.city = document.getElementById("editCity").value.trim();
            payload.postalCode = document
              .getElementById("editPostalCode")
              .value.trim();
          }

          const saveBtn = document.querySelector("#editMode .btn-save");
          saveBtn.disabled = true;
          saveBtn.textContent = "Saving...";

          try {
            const response = await fetchWithAuth("/users/profile", {
              method: "PUT",
              body: JSON.stringify(payload),
            });

            currentUser = { ...currentUser, ...response.user };
            localStorage.setItem("user", JSON.stringify(currentUser));

            renderProfileView();
            toggleEdit(false);
            showMessage("Profile updated successfully!", "success");
          } catch (error) {
            console.error("Update error:", error);
            showMessage("Failed to update profile: " + error.message, "error");
          } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = "Save Changes";
          }
        });

      document.addEventListener("DOMContentLoaded", loadProfile);
    </script>
  </body>
</html>
