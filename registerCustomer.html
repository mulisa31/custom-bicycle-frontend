<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.0.0/uicons-regular-straight/css/uicons-regular-straight.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <style>
      .cb-register-section {
        width: 100% !important;
        min-height: 80vh !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        padding: 60px 20px !important;
        background: #f8f9f7 !important;
        box-sizing: border-box !important;
      }
      .cb-register-card {
        width: 100% !important;
        max-width: 520px !important;
        padding: 42px !important;
        background: #ffffff !important;
        border: 1px solid #e6e9e4 !important;
        border-radius: 16px !important;
        box-shadow: 0 12px 40px rgba(30, 42, 35, 0.08) !important;
        box-sizing: border-box !important;
      }
      .cb-register-brand {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 8px !important;
        margin-bottom: 22px !important;
        color: #2f5d50 !important;
        font-size: 17px !important;
        font-weight: 700 !important;
        letter-spacing: 0.3px !important;
      }
      .cb-register-title {
        margin: 0 !important;
        text-align: center !important;
        color: #1f2d27 !important;
        font-size: 32px !important;
        font-weight: 700 !important;
        line-height: 1.2 !important;
      }
      .cb-register-subtitle {
        max-width: 350px !important;
        margin: 12px auto 32px !important;
        text-align: center !important;
        color: #737b76 !important;
        font-size: 14px !important;
        line-height: 1.6 !important;
      }
      .cb-register-field {
        margin-bottom: 18px !important;
      }
      .cb-register-field label {
        display: block !important;
        margin-bottom: 6px !important;
        color: #29352f !important;
        font-size: 14px !important;
        font-weight: 600 !important;
      }
      .cb-register-field input,
      .cb-register-field select {
        width: 100% !important;
        height: 50px !important;
        padding: 0 15px !important;
        border: 1px solid #d9ded9 !important;
        border-radius: 8px !important;
        background: #fbfcfb !important;
        color: #26332d !important;
        font-family: inherit !important;
        font-size: 14px !important;
        outline: none !important;
        box-sizing: border-box !important;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease !important;
      }
      .cb-register-field input:focus,
      .cb-register-field select:focus {
        border-color: #4d806f !important;
        background: #ffffff !important;
        box-shadow: 0 0 0 3px rgba(77, 128, 111, 0.12) !important;
      }
      .cb-register-field input::placeholder {
        color: #a0a7a3 !important;
      }
      .cb-register-button {
        width: 100% !important;
        height: 52px !important;
        border: none !important;
        border-radius: 8px !important;
        background: #3f705f !important;
        color: #ffffff !important;
        font-family: inherit !important;
        font-size: 15px !important;
        font-weight: 600 !important;
        cursor: pointer !important;
        transition:
          background 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease !important;
      }
      .cb-register-button:hover {
        background: #315b4d !important;
        transform: translateY(-1px) !important;
        box-shadow: 0 6px 16px rgba(63, 112, 95, 0.2) !important;
      }
      .cb-register-button:active {
        transform: translateY(0) !important;
      }
      .cb-register-login {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        flex-wrap: wrap !important;
        gap: 5px !important;
        margin-top: 26px !important;
        color: #737b76 !important;
        font-size: 14px !important;
      }
      .cb-register-login a {
        color: #3f705f !important;
        font-weight: 600 !important;
        text-decoration: none !important;
      }
      .cb-register-login a:hover {
        color: #294e42 !important;
        text-decoration: underline !important;
      }
      .cb-register-error {
        background: #fde8e8;
        color: #a94442;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 16px;
        display: none;
        font-size: 14px;
      }
      .cb-register-success {
        background: #d4edda;
        color: #155724;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 16px;
        display: none;
        font-size: 14px;
      }
      .form-row {
        display: flex;
        gap: 15px;
      }
      .form-row .cb-register-field {
        flex: 1;
      }
      @media (max-width: 576px) {
        .cb-register-card {
          padding: 30px 22px !important;
          border-radius: 12px !important;
        }
        .cb-register-title {
          font-size: 27px !important;
        }
        .form-row {
          flex-direction: column;
          gap: 0;
        }
      }
    </style>
    <title>Register | CBBS</title>
  </head>
  <body>
    <header class="header">
      <div id="header-placeholder"></div>
    </header>

    <main class="main">
      <hr />
      <section class="cb-register-section">
        <div class="cb-register-card">
          <div class="cb-register-brand">
            <span style="text-decoration: underline"
              >Custom Bicycle Building System</span
            >
          </div>

          <h1 class="cb-register-title">Create Your Account</h1>
          <p class="cb-register-subtitle">
            Start building your dream custom bicycle today.
          </p>

          <div id="register-error" class="cb-register-error"></div>
          <div id="register-success" class="cb-register-success"></div>

          <form class="cb-register-form" id="registerForm">
            <div class="cb-register-field">
              <label for="reg-name">Full Name *</label>
              <input
                type="text"
                id="reg-name"
                name="name"
                placeholder="Enter your full name"
                required
              />
            </div>

            <div class="cb-register-field">
              <label for="reg-email">Email Address *</label>
              <input
                type="email"
                id="reg-email"
                name="email"
                placeholder="Enter your email address"
                required
              />
            </div>

            <div class="cb-register-field">
              <label for="reg-password">Password *</label>
              <input
                type="password"
                id="reg-password"
                name="password"
                placeholder="Enter your password"
                required
              />
            </div>

            <div class="cb-register-field">
              <label for="reg-confirm">Confirm Password *</label>
              <input
                type="password"
                id="reg-confirm"
                name="confirm"
                placeholder="Re-enter your password"
                required
              />
            </div>

            <label for="preference"
              >What type of bike do you want to build? *</label
            >
            <select
              id="preference"
              required
              style="
                width: 100%;
                margin-top: 0.3rem;
                padding: 0.5rem;
                border: 1px solid #d9ded9;
                border-radius: 6px;
                font-family: inherit;
                font-size: 0.95rem;
                margin-bottom: 1rem;
              "
            >
              <option value="">Select Bike Type</option>
              <option value="Road Bike">Road Bike</option>
              <option value="Mountain Bike">Mountain Bike</option>
              <option value="Hybrid">Hybrid</option>
              <option value="BMX">BMX</option>
              <option value="Electric">Electric Bike</option>
              <option value="Cruiser">Cruiser</option>
              <option value="Gravel">Gravel Bike</option>
              <option value="Track">Track Bike</option>
              <option value="Other">Other</option>
            </select>
            <div class="cb-register-field">
              <label for="reg-address">Street Address</label>
              <input
                type="text"
                id="reg-address"
                name="address"
                placeholder="Enter your street address"
              />
            </div>
            <div class="cb-register-field">
              <label for="reg-province">Province</label>
              <input
                type="text"
                id="reg-province"
                name="province"
                placeholder="Enter your province"
              />
            </div>
            <div class="cb-register-field">
              <label for="reg-city">City</label>
              <input
                type="text"
                id="reg-city"
                name="city"
                placeholder="Enter your city"
              />
            </div>
            <div class="cb-register-field">
              <label for="reg-postal">Postal Code</label>
              <input
                type="text"
                id="reg-postal"
                name="postalCode"
                placeholder="Enter your postal code"
              />
            </div>
            <div class="cb-register-field">
              <label for="reg-contact">Phone Number *</label>
              <input
                type="tel"
                id="reg-contact"
                name="contact"
                placeholder="Enter your cell phone number"
                required
              />
            </div>

            <div class="cb-register-field" style="display: none">
              <label for="reg-role">Role</label>
              <select id="reg-role" name="role">
                <option value="customer">Customer</option>
                <option value="clerk">Store Clerk</option>
                <option value="admin">Administrator</option>
                <option value="manager">Manager</option>
              </select>
            </div>

            <button type="submit" class="cb-register-button">
              Create Account
            </button>
          </form>

          <div class="cb-register-login">
            <span>Already a cyclist?</span>
            <a href="login.html">Login Here</a>
          </div>
        </div>
      </section>
      <hr />
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/load-components.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("registerForm");
        const errorDiv = document.getElementById("register-error");
        const successDiv = document.getElementById("register-success");

        form.addEventListener("submit", async function (e) {
          e.preventDefault();

          errorDiv.style.display = "none";
          successDiv.style.display = "none";

          const name = document.getElementById("reg-name").value.trim();
          const email = document.getElementById("reg-email").value.trim();
          const password = document.getElementById("reg-password").value;
          const confirm = document.getElementById("reg-confirm").value;
          const address = document.getElementById("reg-address").value.trim();
          const province = document.getElementById("reg-province").value.trim();
          const city = document.getElementById("reg-city").value.trim();
          const postalCode = document.getElementById("reg-postal").value.trim();
          const contact = document.getElementById("reg-contact").value.trim();

          const role = document.getElementById("reg-role")?.value || "customer";
          const preference = document.getElementById("preference").value;

          if (password !== confirm) {
            errorDiv.textContent = "Passwords do not match.";
            errorDiv.style.display = "block";
            return;
          }

          try {
            // call the  backend API
            const response = await fetch(
              "https://custom-bicycle-system-backend.onrender.com/api/auth/register",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  name: name,
                  email: email,
                  password: password,
                  contact: contact,
                  role: role,
                  preference: preference,
                  address: address,
                  province: province,
                  city: city,
                  postalCode: postalCode,
                }),
              },
            );

            const data = await response.json();

            if (response.ok) {
              // clear any old session before sending to login
              localStorage.removeItem("token");
              localStorage.removeItem("user");
              window.location.href = "login.html";
            } else {
              errorDiv.textContent =
                data.error || "Registration failed. Please try again.";
              errorDiv.style.display = "block";
            }
          } catch (error) {
            errorDiv.textContent = "Network error. Please try again.";
            errorDiv.style.display = "block";
          }
        });
      });
    </script>
  </body>
</html>
