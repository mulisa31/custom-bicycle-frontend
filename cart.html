<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.0.0/uicons-regular-straight/css/uicons-regular-straight.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <title>Cart | CBBS</title>
    <style>
      .cart-message {
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        display: none;
        margin-bottom: 15px;
      }
      .cart-message.success {
        display: block;
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .cart-message.error {
        display: block;
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .cart-message.empty {
        display: block;
        background: #f8faf8;
        color: #3f705f;
        border: 1px solid #e8ede8;
        text-align: center;
        font-size: 18px;
        padding: 3rem 2rem;
        margin-top: 1rem;
      }
      .cart-message.empty .sub-text {
        font-size: 14px;
        color: #6c7a8a;
        margin-top: 0.5rem;
        font-weight: 400;
      }
      .btn-delete {
        background: #f8d7da;
        color: #721c24;
        border: none;
        padding: 0.4rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: background 0.2s;
        font-family: inherit;
      }
      .btn-delete:hover {
        background: #f5c6cb;
      }
      .btn-view {
        background: #cce5ff;
        color: #004085;
        border: none;
        padding: 0.4rem 1rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: background 0.2s;
        text-decoration: none;
        display: inline-block;
        font-family: inherit;
      }
      .btn-view:hover {
        background: #b3d9ff;
      }
      .btn-checkout {
        background: #3f705f;
        color: #fff;
        border: none;
        padding: 0.8rem 2rem;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        font-family: inherit;
      }
      .btn-checkout:hover {
        background: #30594c;
      }
      .btn-checkout:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .action-cell {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .hidden {
        display: none !important;
      }
      .confirm-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #cartItemsModal table th,
      #cartItemsModal table td {
        text-align: left !important;
      }

      .confirm-box {
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        max-width: 400px;
        width: 90%;
        text-align: center;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      }
      .confirm-box h3 {
        margin: 0 0 10px 0;
        color: #1a2634;
        font-size: 1.2rem;
      }
      .confirm-box p {
        margin: 0 0 20px 0;
        color: #555;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      .confirm-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .confirm-actions button {
        padding: 8px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-family: inherit;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .btn-confirm-delete {
        background: #dc3545;
        color: #fff;
      }
      .btn-confirm-delete:hover {
        background: #c82333;
      }
      .btn-confirm-cancel {
        background: #e2e8f0;
        color: #2d3f5e;
      }
      .btn-confirm-cancel:hover {
        background: #d0d7e0;
      }
    </style>
  </head>

  <body>
    <header class="header">
      <div id="header-placeholder"></div>
    </header>
    <hr />

    <main class="main">
      <section class="cart section--lg container">
        <h2 style="margin-bottom: 1.5rem">My Carts</h2>

        <div id="cartMessage" class="cart-message"></div>

        <div class="table__container" id="tableContainer">
          <table class="table">
            <thead>
              <tr>
                <th>Cart ID</th>
                <th>Cart Total</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="cartItemsBody">
              <tr>
                <td
                  colspan="3"
                  style="text-align: center; padding: 2rem; color: #6c7a8a"
                >
                  Loading carts...
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="cart__actions" id="cartActions" style="margin-top: 1.5rem">
          <a href="build-your-bicycle.html" class="btn flex btn__md"
            >Build Your Bicycle</a
          >
        </div>

        <div class="divider hidden" id="dividerSection">
          <i class="fi fi-rs-fingerprint"></i>
        </div>

        <div
          class="cart__group grid hidden"
          id="cartGroupSection"
          style="grid-template-columns: 1fr !important"
        >
          <div class="cart__total">
            <h3 class="section__title">Cart Totals</h3>
            <table class="cart__total-table">
              <tr>
                <td><span class="cart__total-title">Cart Subtotal</span></td>
                <td>
                  <span class="cart__total-price" id="cartSubtotal">R0.00</span>
                </td>
              </tr>
              <tr>
                <td><span class="cart__total-title">Shipping</span></td>
                <td>
                  <span class="cart__total-price" id="shippingCost"
                    >R10.00</span
                  >
                </td>
              </tr>
              <tr>
                <td><span class="cart__total-title">Total</span></td>
                <td>
                  <span class="cart__total-price" id="cartTotal">R0.00</span>
                </td>
              </tr>
            </table>
            <div
              style="
                display: flex;
                gap: 1rem;
                flex-wrap: wrap;
                margin-top: 1rem;
              "
            >
              <button class="btn-checkout" id="checkoutBtn" disabled>
                Place Order
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <hr />
    <footer class="footer container">
      <div id="footer-placeholder"></div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/load-components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
      // Base URL for the backend API
      const API_BASE = "https://custom-bicycle-system-backend.onrender.com/api";
      const token = localStorage.getItem("token");

      // We store cart data here
      let allCarts = [];
      let allCartItems = [];
      let deleteCartId = null;

      function showMessage(text, type) {
        const el = document.getElementById("cartMessage");
        el.textContent = text;
        el.className = "cart-message " + type;
      }

      function fetchWithAuth(endpoint, options = {}) {
        return fetch(`${API_BASE}${endpoint}`, {
          ...options,
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
            ...options.headers,
          },
        }).then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        });
      }

      function showEmptyCart() {
        const tbody = document.getElementById("cartItemsBody");
        tbody.innerHTML = "";
        document.getElementById("cartSubtotal").textContent = "R0.00";
        document.getElementById("cartTotal").textContent = "R0.00";
        document.getElementById("checkoutBtn").disabled = true;
        document.getElementById("dividerSection").classList.add("hidden");
        document.getElementById("cartGroupSection").classList.add("hidden");
        document.getElementById("cartActions").classList.remove("hidden");

        const el = document.getElementById("cartMessage");
        el.className = "cart-message empty";
        el.innerHTML = `
          Your cart is empty.
          <div class="sub-text">Build a bicycle to add items to your cart.</div>
        `;
      }

      function showCartWithItems() {
        document.getElementById("cartActions").classList.add("hidden");
        document.getElementById("dividerSection").classList.remove("hidden");
        document.getElementById("cartGroupSection").classList.remove("hidden");
      }

      async function loadCarts() {
        const tbody = document.getElementById("cartItemsBody");

        if (!token) {
          tbody.innerHTML = `
            <tr>
              <td colspan="3" style="text-align:center;padding:2rem;color:#6c7a8a;">
                Please <a href="login.html" style="color:#3f705f;font-weight:600;">login</a> to view your carts.
              </td>
            </tr>
          `;
          document.getElementById("dividerSection").classList.add("hidden");
          document.getElementById("cartGroupSection").classList.add("hidden");
          return;
        }

        try {
          const cart = await fetchWithAuth("/cart");

          if (!cart || !cart.CartItems || cart.CartItems.length === 0) {
            showEmptyCart();
            return;
          }

          showCartWithItems();
          document.getElementById("cartMessage").className = "cart-message";
          document.getElementById("cartMessage").textContent = "";

          allCartItems = cart.CartItems;

          const cartsMap = {};
          cart.CartItems.forEach((item) => {
            const cartId = cart.id;
            if (!cartsMap[cartId]) {
              cartsMap[cartId] = { cartId: cartId, items: [], subtotal: 0 };
            }
            cartsMap[cartId].items.push(item);
            cartsMap[cartId].subtotal +=
              Number(item.Component.unitPrice) * (item.quantity || 1);
          });

          allCarts = Object.values(cartsMap);

          let html = "";
          let grandTotal = 0;

          allCarts.forEach((cartEntry) => {
            grandTotal += cartEntry.subtotal;
            html += `
              <tr>
                <td><strong>Cart #${cartEntry.cartId}</strong></td>
                <td>R${cartEntry.subtotal.toFixed(2)}</td>
                <td>
                  <div class="action-cell">
                    <button class="btn-view" onclick="viewCart(${cartEntry.cartId})">View</button>
                    <button class="btn-delete" onclick="showDeleteConfirm(${cartEntry.cartId})">Delete</button>
                  </div>
                </td>
              </tr>
            `;
          });

          tbody.innerHTML = html;
          document.getElementById("cartSubtotal").textContent =
            `R${grandTotal.toFixed(2)}`;
          document.getElementById("cartTotal").textContent =
            `R${(grandTotal + 10).toFixed(2)}`;
          document.getElementById("checkoutBtn").disabled = false;
        } catch (error) {
          console.error("Error loading carts:", error);
          if (error.message.includes("404")) {
            showEmptyCart();
          } else {
            tbody.innerHTML = `
              <tr>
                <td colspan="3" style="text-align:center;padding:2rem;color:#dc3545;">
                  Failed to load carts. Please try again.
                </td>
              </tr>
            `;
          }
        }
      }

      // View cart items modal
      function viewCart(cartId) {
        const existingModal = document.getElementById("cartItemsModal");
        if (existingModal) existingModal.remove();

        const cartEntry = allCarts.find((c) => c.cartId === cartId);
        if (!cartEntry) return;

        const modal = document.createElement("div");
        modal.id = "cartItemsModal";
        modal.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0,0,0,0.5);
          z-index: 999;
          display: flex;
          justify-content: center;
          align-items: center;
        `;

        const bikeGroups = {};
        cartEntry.items.forEach((item) => {
          const groupId = item.bicycleGroupId || "unknown";
          if (!bikeGroups[groupId]) bikeGroups[groupId] = [];
          bikeGroups[groupId].push(item);
        });

        let modalBody = `<h3 style="margin-top:0;color:#1a2634;">Cart #${cartId} Items</h3>`;
        let fullTotal = 0;

        Object.keys(bikeGroups).forEach((groupId, index) => {
          const items = bikeGroups[groupId];
          let bikeSubtotal = 0;
          items.forEach((item) => {
            bikeSubtotal +=
              Number(item.Component.unitPrice) * (item.quantity || 1);
          });
          fullTotal += bikeSubtotal;

          modalBody += `
            <h4 style="margin:15px 0 5px;color:#3f705f;">Bike ${index + 1} <small>(ID: ${groupId.substring(0, 8)})</small></h4>
            <table style="width:100%;border-collapse:collapse;font-size:0.9rem;">
              <thead><tr><th>Category</th><th>Component</th><th>Price</th></tr></thead>
              <tbody>
          `;
          items.forEach((item) => {
            modalBody += `
              <tr>
                <td>${item.Component.category || "General"}</td>
                <td>${item.Component.name}</td>
                <td>R${Number(item.Component.unitPrice).toFixed(2)}</td>
              </tr>
            `;
          });
          modalBody += `</tbody></table>`;

          if (Object.keys(bikeGroups).length > 1) {
            modalBody += `<div style="text-align:right;font-weight:600;margin-top:5px;">Subtotal: R${bikeSubtotal.toFixed(2)}</div>`;
          }
        });

        modalBody += `
          <div style="margin-top:20px;padding:15px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;text-align:right;">
            <span style="font-size:0.9rem;color:#2d3f5e;font-weight:600;">Full Total</span>
            <span style="font-size:1.5rem;font-weight:700;color:#1a2634;margin-left:10px;">R${fullTotal.toFixed(2)}</span>
          </div>
          <div style="margin-top:15px;text-align:right;">
            <button onclick="document.getElementById('cartItemsModal').remove()" style="padding:8px 20px;background:#3f705f;color:#fff;border:none;border-radius:5px;cursor:pointer;">Close</button>
          </div>
        `;

        modal.innerHTML = `<div style="background:#fff;padding:25px;border-radius:10px;max-width:650px;width:90%;max-height:80vh;overflow-y:auto;">${modalBody}</div>`;
        document.body.appendChild(modal);
        modal.addEventListener("click", function (e) {
          if (e.target === this) this.remove();
        });
      }

      function showDeleteConfirm(cartId) {
        deleteCartId = cartId;
        const existingModal = document.getElementById("deleteConfirmModal");
        if (existingModal) existingModal.remove();

        const modal = document.createElement("div");
        modal.id = "deleteConfirmModal";
        modal.className = "confirm-overlay";

        modal.innerHTML = `
          <div class="confirm-box">
            <h3>Delete Cart?</h3>
            <p>Are you sure you want to delete Cart #${cartId} and all its components? This action cannot be undone.</p>
            <div class="confirm-actions">
              <button class="btn-confirm-cancel" onclick="closeDeleteConfirm()">Cancel</button>
              <button class="btn-confirm-delete" onclick="confirmDeleteCart()">Delete</button>
            </div>
          </div>
        `;

        document.body.appendChild(modal);
        modal.addEventListener("click", function (e) {
          if (e.target === this) this.remove();
        });
      }

      function closeDeleteConfirm() {
        const modal = document.getElementById("deleteConfirmModal");
        if (modal) modal.remove();
        deleteCartId = null;
      }

      async function confirmDeleteCart() {
        if (!deleteCartId) return;
        try {
          await fetchWithAuth("/cart/clear", { method: "DELETE" });
          closeDeleteConfirm();
          await loadCarts();
          showMessage("Cart deleted successfully.", "success");
        } catch (error) {
          closeDeleteConfirm();
          showMessage("Failed to delete cart: " + error.message, "error");
        }
      }

      async function placeOrder() {
        const checkoutBtn = document.getElementById("checkoutBtn");
        if (checkoutBtn.disabled) return;

        const user = JSON.parse(localStorage.getItem("user") || "{}");
        const province = user.province || "";
        const city = user.city || "";
        const postcode = user.postalCode || "";
        const address = user.address || "";

        if (!province || !city || !postcode || !address) {
          showMessage(
            "Please update your profile with your full address before placing an order.",
            "error",
          );
          return;
        }

        checkoutBtn.disabled = true;
        checkoutBtn.textContent = "Placing Order...";

        try {
          let subtotal = 0;
          allCarts.forEach((cartEntry) => {
            subtotal += cartEntry.subtotal;
          });
          const totalPrice = subtotal + 10;

          await fetchWithAuth("/orders", {
            method: "POST",
            body: JSON.stringify({
              totalPrice: totalPrice,
              shippingProvince: province,
              shippingCity: city,
              shippingPostcode: postcode,
              shippingAddress: address,
            }),
          });

          for (let item of allCartItems) {
            const componentId = item.componentId || item.Component?.id;
            if (componentId) {
              await fetchWithAuth(`/components/${componentId}/reduce-stock`, {
                method: "PUT",
                body: JSON.stringify({ quantity: 1 }),
              });
            }
          }

          await fetchWithAuth("/cart/clear", { method: "DELETE" });
          await fetchWithAuth("/cart/checkout", { method: "PUT" });

          localStorage.setItem(
            "shippingDetails",
            JSON.stringify({ province, city, postcode, address }),
          );

          showMessage("Order placed successfully! Redirecting...", "success");
          checkoutBtn.textContent = "Place Order";

          setTimeout(() => {
            window.location.href = "order-history.html";
          }, 1500);
        } catch (error) {
          console.error("Place order error:", error);
          checkoutBtn.disabled = false;
          checkoutBtn.textContent = "Place Order";
          showMessage("Failed to place order: " + error.message, "error");
        }
      }

      document
        .getElementById("checkoutBtn")
        .addEventListener("click", placeOrder);
      document.addEventListener("DOMContentLoaded", loadCarts);
    </script>
  </body>
</html>
