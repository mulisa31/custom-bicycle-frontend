<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/2.0.0/uicons-regular-straight/css/uicons-regular-straight.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <style>
      .cb-login-section {
        width: 100% !important;
        min-height: 75vh !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        padding: 60px 20px !important;
        background: #f8f9f7 !important;
        box-sizing: border-box !important;
      }
      .cb-login-card {
        width: 100% !important;
        max-width: 460px !important;
        padding: 42px !important;
        background: #ffffff !important;
        border: 1px solid #e6e9e4 !important;
        border-radius: 16px !important;
        box-shadow: 0 12px 40px rgba(30, 42, 35, 0.08) !important;
        box-sizing: border-box !important;
      }
      .cb-login-brand {
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 8px !important;
        margin-bottom: 22px !important;
        color: #2f5d50 !important;
        font-size: 17px !important;
        font-weight: 700 !important;
        letter-spacing: 0.3px !important;
      }
      .cb-login-title {
        margin: 0 !important;
        text-align: center !important;
        color: #1f2d27 !important;
        font-size: 32px !important;
        font-weight: 700 !important;
        line-height: 1.2 !important;
      }
      .cb-login-subtitle {
        max-width: 350px !important;
        margin: 12px auto 32px !important;
        text-align: center !important;
        color: #737b76 !important;
        font-size: 14px !important;
        line-height: 1.6 !important;
      }
      .cb-login-field {
        margin-bottom: 20px !important;
      }
      .cb-login-field label {
        display: block !important;
        margin-bottom: 8px !important;
        color: #29352f !important;
        font-size: 14px !important;
        font-weight: 600 !important;
      }
      .cb-login-field input[type="email"],
      .cb-login-field input[type="password"] {
        width: 100% !important;
        height: 50px !important;
        padding: 0 15px !important;
        border: 1px solid #d9ded9 !important;
        border-radius: 8px !important;
        background: #fbfcfb !important;
        color: #26332d !important;
        font-family: inherit !important;
        font-size: 14px !important;
        outline: none !important;
        box-sizing: border-box !important;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          background 0.2s ease !important;
      }
      .cb-login-field input:focus {
        border-color: #4d806f !important;
        background: #ffffff !important;
        box-shadow: 0 0 0 3px rgba(77, 128, 111, 0.12) !important;
      }
      .cb-login-field input::placeholder {
        color: #a0a7a3 !important;
      }
      .cb-login-button {
        width: 100% !important;
        height: 52px !important;
        border: none !important;
        border-radius: 8px !important;
        background: #3f705f !important;
        color: #ffffff !important;
        font-family: inherit !important;
        font-size: 15px !important;
        font-weight: 600 !important;
        cursor: pointer !important;
        transition:
          background 0.2s ease,
          transform 0.2s ease,
          box-shadow 0.2s ease !important;
      }
      .cb-login-button:hover {
        background: #315b4d !important;
        transform: translateY(-1px) !important;
        box-shadow: 0 6px 16px rgba(63, 112, 95, 0.2) !important;
      }
      .cb-login-button:active {
        transform: translateY(0) !important;
      }
      .cb-login-register {
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
        flex-wrap: wrap !important;
        gap: 5px !important;
        margin-top: 26px !important;
        color: #737b76 !important;
        font-size: 14px !important;
      }
      .cb-login-register a {
        color: #3f705f !important;
        font-weight: 600 !important;
        text-decoration: none !important;
      }
      .cb-login-register a:hover {
        color: #294e42 !important;
        text-decoration: underline !important;
      }
      .cb-login-error {
        background: #fde8e8;
        color: #a94442;
        padding: 10px;
        border-radius: 6px;
        margin-bottom: 16px;
        display: none;
        font-size: 14px;
      }
      @media (max-width: 576px) {
        .cb-login-card {
          padding: 30px 22px !important;
          border-radius: 12px !important;
        }
        .cb-login-title {
          font-size: 27px !important;
        }
      }
    </style>
    <title>Login | CBBS</title>
  </head>
  <body>
    <header class="header">
      <div id="header-placeholder"></div>
    </header>

    <main class="main">
      <hr />
      <section class="cb-login-section">
        <div class="cb-login-card">
          <div class="cb-login-brand">
            <span style="text-decoration: underline"
              >Custom Bicycle Building System</span
            >
          </div>
          <h1 class="cb-login-title">Welcome Back</h1>
          <p class="cb-login-subtitle">
            Sign in to continue building your perfect bicycle.
          </p>

          <div id="login-error" class="cb-login-error"></div>

          <form class="cb-login-form" id="loginForm">
            <div class="cb-login-field">
              <label for="cb-email">Email Address</label>
              <input
                type="email"
                id="cb-email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>
            <div class="cb-login-field">
              <label for="cb-password">Password</label>
              <input
                type="password"
                id="cb-password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
            </div>
            <button type="submit" class="cb-login-button">Sign In</button>
          </form>

          <div class="cb-login-register">
            <span>Don't have an account?</span>
            <a href="registerCustomer.html">Create an account</a>
          </div>
        </div>
      </section>
      <hr />
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/load-components.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("loginForm");
        const errorDiv = document.getElementById("login-error");

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          errorDiv.style.display = "none";

          const email = document.getElementById("cb-email").value.trim();
          const password = document.getElementById("cb-password").value;

          if (!email || !password) {
            errorDiv.textContent = "Please enter email and password.";
            errorDiv.style.display = "block";
            return;
          }

          try {
            // Call the backend API for login
            const response = await fetch(
              "https://custom-bicycle-system-backend.onrender.com/api/auth/login",
              {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password }),
              },
            );

            const data = await response.json();

            if (response.ok) {
              // Clear any old session before saving new one
              localStorage.removeItem("token");
              localStorage.removeItem("user");

              // Save the token and user info
              const sessionUser = data.user || data;
              if (typeof saveSession === "function") {
                saveSession(data.token, sessionUser);
              } else {
                localStorage.setItem("token", data.token);
                localStorage.setItem("user", JSON.stringify(sessionUser));
              }

              // Redirect based on role
              const role = sessionUser && sessionUser.role;
              if (role === "admin") {
                window.location.href = "dashboard.html";
              } else if (role === "clerk") {
                window.location.href = "clerk-manage-orders.html";
              } else if (role === "manager") {
                window.location.href = "manager-stock.html";
              } else {
                // Customer or default
                window.location.href = "index.html";
              }
            } else {
              errorDiv.textContent = data.error || "Invalid email or password.";
              errorDiv.style.display = "block";
            }
          } catch (error) {
            errorDiv.textContent = "Network error. Please try again.";
            errorDiv.style.display = "block";
          }
        });
      });
    </script>
  </body>
</html>
