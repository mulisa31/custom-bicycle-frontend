<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Orders | CBBS</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      .orders-container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1.5rem;
      }
      .page-header {
        margin-bottom: 1.5rem;
      }
      .page-header h1 {
        font-size: 1.8rem;
        color: #1a2634;
        margin: 0;
      }
      .filter-section {
        background: #fff;
        padding: 1rem 1.5rem;
        border-radius: 8px;
        border: 1px solid #e2e8f0;
        margin-bottom: 1.5rem;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .filter-section select {
        padding: 0.5rem 1rem;
        border: 1px solid #d9ded9;
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.9rem;
        background: #fff;
        color: #1a2634;
        min-width: 160px;
        cursor: pointer;
      }
      .filter-section select:focus {
        border-color: #3f705f;
        outline: none;
      }
      .filter-section .btn {
        padding: 0.5rem 1.5rem;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-family: inherit;
        font-size: 0.9rem;
        transition: background 0.2s;
      }
      .btn-apply {
        background: #3f705f;
        color: #fff;
      }
      .btn-apply:hover {
        background: #2f5a4c;
      }
      .btn-clear {
        background: #e2e8f0;
        color: #2d3f5e;
      }
      .btn-clear:hover {
        background: #d0d7e0;
      }
      .table-wrap {
        background: #fff;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        overflow-x: auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        padding: 0.8rem 1rem;
        text-align: left;
        border-bottom: 1px solid #edf2f7;
      }
      th {
        background: #f8fafc;
        font-weight: 600;
        color: #2d3f5e;
      }
      .status-badge {
        display: inline-block;
        padding: 0.25rem 0.8rem;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: capitalize;
      }
      .status-badge.pending {
        background: #fff3cd;
        color: #856404;
      }
      .status-badge.assembling {
        background: #cce5ff;
        color: #004085;
      }
      .status-badge.ready {
        background: #d1ecf1;
        color: #0c5460;
      }
      .status-badge.shipped {
        background: #d4edda;
        color: #155724;
      }
      .status-badge.completed {
        background: #d4edda;
        color: #155724;
        font-weight: 700;
      }
      .status-select {
        padding: 0.3rem;
        border: 1px solid #d9ded9;
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.85rem;
        background: #fff;
        cursor: pointer;
      }
      .btn-save {
        background: #3f705f;
        color: #fff;
        border: none;
        padding: 0.3rem 0.8rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: background 0.2s;
      }
      .btn-save:hover {
        background: #2f5a4c;
      }
      .btn-ship {
        background: #d1ecf1;
        color: #0c5460;
        border: none;
        padding: 0.3rem 0.8rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: background 0.2s;
      }
      .btn-ship:hover {
        background: #bee5eb;
      }
      .btn-complete {
        background: #d4edda;
        color: #155724;
        border: none;
        padding: 0.3rem 0.8rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: background 0.2s;
      }
      .btn-complete:hover {
        background: #c3e6cb;
      }
      .btn-view {
        background: #cce5ff;
        color: #004085;
        border: none;
        padding: 0.3rem 0.8rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: background 0.2s;
      }
      .btn-view:hover {
        background: #b3d9ff;
      }
      .message {
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        display: none;
        margin-bottom: 15px;
      }
      .message.success {
        display: block;
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .message.error {
        display: block;
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .loading {
        text-align: center;
        color: #6c7a8a;
        padding: 2rem;
      }
      .hidden {
        display: none !important;
      }

      /* Modal styles */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .modal-box {
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        max-width: 650px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      }
      .modal-box h3 {
        margin: 0 0 15px 0;
        color: #1a2634;
      }
      .modal-box table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      .modal-box table th,
      .modal-box table td {
        padding: 8px;
        text-align: left;
        border-bottom: 1px solid #f0f2f5;
      }
      .modal-box table th {
        background: #f8fafc;
        font-weight: 600;
        color: #2d3f5e;
      }
      .modal-close {
        margin-top: 15px;
        text-align: right;
      }
      .modal-close button {
        padding: 8px 20px;
        background: #3f705f;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div id="header-placeholder"></div>
    </header>
    <hr />

    <main>
      <div class="orders-container">
        <div class="page-header">
          <h1><i class="fas fa-clipboard-list"></i> Manage Orders</h1>
        </div>

        <div id="orderMessage" class="message"></div>

        <div class="filter-section">
          <select id="filterStatus">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="assembling">Assembling</option>
            <option value="ready">Ready</option>
            <option value="shipped">Shipped</option>
            <option value="completed">Completed</option>
          </select>
          <button class="btn btn-apply" onclick="applyFilter()">Apply</button>
          <button class="btn btn-clear" onclick="clearFilter()">Clear</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Order ID</th>
                <th>Customer</th>
                <th>Total</th>
                <th>Date</th>
                <th>Status</th>
                <th>Update</th>
                <th>View</th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr>
                <td colspan="7" class="loading">
                  <i class="fas fa-spinner fa-spin"></i> Loading...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <hr />
    </main>

    <div id="footer-placeholder"></div>

    <!-- View Items Modal -->
    <div id="orderItemsModal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3 id="modalTitle">Order Items</h3>
        <div id="modalBody"></div>
        <div class="modal-close">
          <button onclick="closeOrderItemsModal()">Close</button>
        </div>
      </div>
    </div>

    <script src="assets/js/load-components.js"></script>
    <script>
      // Base URL for the API
      const API_BASE = "https://custom-bicycle-system-backend.onrender.com/api";
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user") || "null");

      // Only clerks can access this page
      if (!token || !user || user.role !== "clerk") {
        window.location.href = "login.html";
      }

      // Store all orders and filtered orders
      let allOrders = [];
      let filteredOrders = [];

      // Wrapper for fetch that adds the Authorization header
      function fetchWithAuth(endpoint, options = {}) {
        return fetch(`${API_BASE}${endpoint}`, {
          ...options,
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
            ...options.headers,
          },
        }).then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        });
      }

      // Show a temporary message at the top
      function showMessage(text, type) {
        const el = document.getElementById("orderMessage");
        el.textContent = text;
        el.className = "message " + type;
        setTimeout(() => {
          el.className = "message";
          el.textContent = "";
        }, 4000);
      }

      // Format a date string
      function formatDate(dateString) {
        if (!dateString) return "N/A";
        return new Date(dateString).toLocaleDateString("en-ZA", {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      }

      // Render the table body with given orders
      function renderOrders(orders) {
        const tbody = document.getElementById("ordersBody");
        if (orders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No orders found</td></tr>`;
          return;
        }

        tbody.innerHTML = orders
          .map((order) => {
            const customer = order.User
              ? order.User.name
              : `User #${order.userId}`;
            const status = order.status || "pending";

            // Update cell content based on status
            let updateCell = "";
            if (status === "pending") {
              updateCell = `
                <select class="status-select" data-id="${order.id}">
                  <option value="pending" selected>Pending</option>
                  <option value="assembling">Assembling</option>
                </select>
                <button class="btn-save" onclick="updateStatus(${order.id})">Save</button>
              `;
            } else if (status === "ready") {
              updateCell = `
                <button class="btn-ship" onclick="markShipped(${order.id})">Mark Shipped</button>
              `;
            } else if (status === "shipped") {
              updateCell = `
                <button class="btn-complete" onclick="markCompleted(${order.id})">Mark Completed</button>
              `;
            } else {
              // assembling or completed - read-only
              updateCell = `<span class="status-badge ${status}">${status}</span>`;
            }

            return `
              <tr>
                <td><strong>#${order.id}</strong></td>
                <td>${customer}</td>
                <td>R${Number(order.totalPrice || 0).toFixed(2)}</td>
                <td>${formatDate(order.createdAt)}</td>
                <td><span class="status-badge ${status}">${status}</span></td>
                <td>${updateCell}</td>
                <td>
                  <button class="btn-view" onclick="viewOrderItems(${order.id})">View Items</button>
                </td>
              </tr>
            `;
          })
          .join("");
      }

      // Filter orders by selected status
      function applyFilter() {
        const status = document.getElementById("filterStatus").value;
        if (!status) {
          filteredOrders = [...allOrders];
        } else {
          filteredOrders = allOrders.filter((o) => o.status === status);
        }
        renderOrders(filteredOrders);
      }

      // Clear the status filter
      function clearFilter() {
        document.getElementById("filterStatus").value = "";
        filteredOrders = [...allOrders];
        renderOrders(filteredOrders);
      }

      // Update order status (pending -> assembling)
      async function updateStatus(orderId) {
        const select = document.querySelector(
          `.status-select[data-id="${orderId}"]`,
        );
        if (!select) return;
        const newStatus = select.value;

        try {
          await fetchWithAuth(`/orders/${orderId}/status`, {
            method: "PUT",
            body: JSON.stringify({ status: newStatus }),
          });
          const order = allOrders.find((o) => o.id === orderId);
          if (order) order.status = newStatus;
          applyFilter();
          showMessage(`Order #${orderId} updated to ${newStatus}.`, "success");
        } catch (error) {
          console.error("Update error:", error);
          showMessage("Failed to update status: " + error.message, "error");
        }
      }

      // Mark ready order as shipped (fulfilment)
      async function markShipped(orderId) {
        try {
          await fetchWithAuth(`/orders/${orderId}/status`, {
            method: "PUT",
            body: JSON.stringify({ status: "shipped" }),
          });
          const order = allOrders.find((o) => o.id === orderId);
          if (order) order.status = "shipped";
          applyFilter();
          showMessage(`Order #${orderId} marked as shipped.`, "success");
        } catch (error) {
          console.error("Ship error:", error);
          showMessage("Failed to ship order: " + error.message, "error");
        }
      }

      // Mark shipped order as completed (finalize)
      async function markCompleted(orderId) {
        try {
          await fetchWithAuth(`/orders/${orderId}/status`, {
            method: "PUT",
            body: JSON.stringify({ status: "completed" }),
          });
          const order = allOrders.find((o) => o.id === orderId);
          if (order) order.status = "completed";
          applyFilter();
          showMessage(`Order #${orderId} marked as completed.`, "success");
        } catch (error) {
          console.error("Complete order error:", error);
          showMessage("Failed to complete order: " + error.message, "error");
        }
      }

      // Open order items modal grouped by bicycle
      function viewOrderItems(orderId) {
        const order = allOrders.find((o) => o.id === orderId);
        if (!order) return;

        const modal = document.getElementById("orderItemsModal");
        const title = document.getElementById("modalTitle");
        const body = document.getElementById("modalBody");

        title.textContent = `Order #${order.id} Items`;

        // group order items by bicycleGroupId
        const bikeGroups = {};
        (order.OrderItems || []).forEach((item) => {
          const groupId = item.bicycleGroupId || "unknown";
          if (!bikeGroups[groupId]) bikeGroups[groupId] = [];
          bikeGroups[groupId].push(item);
        });

        let html = "";
        let fullTotal = 0;

        Object.keys(bikeGroups).forEach((groupId, index) => {
          const items = bikeGroups[groupId];
          let bikeSubtotal = 0;

          items.forEach((item) => {
            bikeSubtotal +=
              Number(item.Component.unitPrice) * (item.quantity || 1);
          });
          fullTotal += bikeSubtotal;

          html += `
            <h4 style="margin:15px 0 5px;color:#3f705f;">Bike ${index + 1} <small style="font-weight:400;">(ID: ${groupId.substring(0, 8)})</small></h4>
            <table>
              <thead>
                <tr>
                  <th>Category</th>
                  <th>Component</th>
                  <th>Price</th>
                </tr>
              </thead>
              <tbody>
          `;
          items.forEach((item) => {
            html += `
              <tr>
                <td>${item.Component ? item.Component.category || "General" : "N/A"}</td>
                <td>${item.Component ? item.Component.name : "Unknown"}</td>
                <td>R${item.Component ? Number(item.Component.unitPrice).toFixed(2) : "0.00"}</td>
              </tr>
            `;
          });
          html += `</tbody></table>`;

          if (Object.keys(bikeGroups).length > 1) {
            html += `<div style="text-align:right;font-weight:600;margin-top:5px;">Subtotal: R${bikeSubtotal.toFixed(2)}</div>`;
          }
        });

        html += `
          <div style="margin-top:20px;padding:15px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;text-align:right;">
            <span style="font-size:0.9rem;color:#2d3f5e;font-weight:600;">Full Total</span>
            <span style="font-size:1.5rem;font-weight:700;color:#1a2634;margin-left:10px;">R${fullTotal.toFixed(2)}</span>
          </div>
        `;

        body.innerHTML = html;
        modal.classList.remove("hidden");
      }

      // Close order items modal
      function closeOrderItemsModal() {
        document.getElementById("orderItemsModal").classList.add("hidden");
      }

      // Load all orders from the backend
      async function loadOrders() {
        const tbody = document.getElementById("ordersBody");
        tbody.innerHTML = `<tr><td colspan="7" class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>`;
        try {
          const orders = await fetchWithAuth("/orders/all");
          allOrders = Array.isArray(orders) ? orders : [];
          filteredOrders = [...allOrders];
          renderOrders(filteredOrders);
        } catch (error) {
          console.error("Load error:", error);
          tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:#dc3545;">Failed to load orders</td></tr>`;
        }
      }

      // When the page loads, fetch and display orders
      document.addEventListener("DOMContentLoaded", loadOrders);
    </script>
  </body>
</html>
