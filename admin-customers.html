<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customers | Admin | CBBS</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      .customers-container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1.5rem;
      }
      .page-header {
        margin-bottom: 1.5rem;
      }
      .page-header h1 {
        font-size: 1.8rem;
        color: #1a2634;
        margin: 0;
      }
      .table-wrap {
        background: #fff;
        border-radius: 10px;
        border: 1px solid #e2e8f0;
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }
      th,
      td {
        padding: 0.8rem 1rem;
        text-align: left;
        border-bottom: 1px solid #edf2f7;
      }
      th {
        background: #f8fafc;
        font-weight: 600;
        color: #2d3f5e;
      }
      .btn-edit,
      .btn-delete {
        border: none;
        padding: 0.3rem 0.8rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        transition: background 0.2s;
      }
      .btn-edit {
        background: #cce5ff;
        color: #004085;
      }
      .btn-edit:hover {
        background: #b3d9ff;
      }
      .btn-delete {
        background: #f8d7da;
        color: #721c24;
        margin-left: 0.5rem;
      }
      .btn-delete:hover {
        background: #f5c6cb;
      }
      .message {
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 500;
        display: none;
        margin-bottom: 15px;
      }
      .message.success {
        display: block;
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .message.error {
        display: block;
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .loading {
        text-align: center;
        padding: 2rem;
        color: #6c7a8a;
      }
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .modal-box {
        background: #fff;
        padding: 25px;
        border-radius: 10px;
        max-width: 500px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      }
      .modal-box h3 {
        margin: 0 0 15px 0;
        color: #1a2634;
      }
      .form-group {
        margin-bottom: 1rem;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 600;
        color: #2d3f5e;
        font-size: 0.9rem;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid #d9ded9;
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.95rem;
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 20px;
      }
      .btn-save {
        background: #3f705f;
        color: #fff;
        border: none;
        padding: 0.5rem 1.5rem;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }
      .btn-cancel {
        background: #e2e8f0;
        color: #2d3f5e;
        border: none;
        padding: 0.5rem 1.5rem;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header class="header"><div id="header-placeholder"></div></header>
    <hr />
    <main>
      <div class="customers-container">
        <div class="page-header">
          <h1><i class="fas fa-users"></i> Customer Profiles</h1>
        </div>
        <div id="customerMessage" class="message"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Contact</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="customersBody">
              <tr>
                <td colspan="5" class="loading">Loading customers...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <hr />
    <div id="footer-placeholder"></div>

    <!-- Edit Customer Modal -->
    <div id="editCustomerModal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3>Edit Customer</h3>
        <form id="editCustomerForm">
          <input type="hidden" id="editCustomerId" />
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="editCustomerName" required />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="editCustomerEmail" disabled />
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="editCustomerContact" required />
          </div>
          <div class="form-group">
            <label>Street Address</label>
            <input type="text" id="editCustomerAddress" />
          </div>
          <div class="form-group">
            <label>Province</label>
            <input type="text" id="editCustomerProvince" />
          </div>
          <div class="form-group">
            <label>City</label>
            <input type="text" id="editCustomerCity" />
          </div>
          <div class="form-group">
            <label>Postal Code</label>
            <input type="text" id="editCustomerPostal" />
          </div>
          <div class="form-group">
            <label>Preferred Bike Type</label>
            <select id="editCustomerPreference">
              <option value="">Select Bike Type</option>
              <option value="Road Bike">Road Bike</option>
              <option value="Mountain Bike">Mountain Bike</option>
              <option value="Hybrid">Hybrid</option>
              <option value="BMX">BMX</option>
              <option value="Electric">Electric Bike</option>
              <option value="Cruiser">Cruiser</option>
              <option value="Gravel">Gravel Bike</option>
              <option value="Track">Track Bike</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="modal-actions">
            <button
              type="button"
              class="btn-cancel"
              onclick="closeEditCustomer()"
            >
              Cancel
            </button>
            <button type="submit" class="btn-save">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteCustomerModal" class="modal-overlay hidden">
      <div class="modal-box" style="max-width: 400px; text-align: center">
        <h3>Delete Customer?</h3>
        <p id="deleteCustomerMsg" style="margin: 20px 0">Are you sure?</p>
        <div class="modal-actions" style="justify-content: center">
          <button class="btn-cancel" onclick="closeDeleteCustomer()">
            Cancel
          </button>
          <button
            class="btn-save"
            style="background: #dc3545"
            onclick="confirmDeleteCustomer()"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    <script src="assets/js/load-components.js"></script>
    <script>
      const API_BASE = "https://custom-bicycle-system-backend.onrender.com/api";
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user") || "null");

      // admin only
      if (!token || !user || user.role !== "admin") {
        window.location.href = "login.html";
      }

      let allCustomers = [];
      let deleteCustomerId = null;

      function showMessage(text, type) {
        const el = document.getElementById("customerMessage");
        el.textContent = text;
        el.className = "message " + type;
        setTimeout(() => {
          el.className = "message";
          el.textContent = "";
        }, 4000);
      }

      async function fetchWithAuth(endpoint, options = {}) {
        const res = await fetch(`${API_BASE}${endpoint}`, {
          ...options,
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
            ...options.headers,
          },
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      }

      async function loadCustomers() {
        const tbody = document.getElementById("customersBody");
        try {
          const customers = await fetchWithAuth("/users/customers");
          allCustomers = customers;
          if (customers.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="loading">No customers found.</td></tr>`;
            return;
          }
          tbody.innerHTML = customers
            .map(
              (customer) => `
            <tr>
              <td>${customer.id}</td>
              <td>${customer.name}</td>
              <td>${customer.email}</td>
              <td>${customer.contact || "-"}</td>
              <td>
                <button class="btn-edit" onclick="openEditCustomer(${customer.id})">Edit</button>
                <button class="btn-delete" onclick="openDeleteCustomer(${customer.id})">Delete</button>
              </td>
            </tr>
          `,
            )
            .join("");
        } catch (error) {
          tbody.innerHTML = `<tr><td colspan="5" class="loading">Failed to load customers.</td></tr>`;
        }
      }

      function openEditCustomer(id) {
        const customer = allCustomers.find((c) => c.id === id);
        if (!customer) return;
        document.getElementById("editCustomerId").value = customer.id;
        document.getElementById("editCustomerName").value = customer.name || "";
        document.getElementById("editCustomerEmail").value =
          customer.email || "";
        document.getElementById("editCustomerContact").value =
          customer.contact || "";
        document.getElementById("editCustomerAddress").value =
          customer.address || "";
        document.getElementById("editCustomerProvince").value =
          customer.province || "";
        document.getElementById("editCustomerCity").value = customer.city || "";
        document.getElementById("editCustomerPostal").value =
          customer.postalCode || "";
        document.getElementById("editCustomerPreference").value =
          customer.preference || "";
        document.getElementById("editCustomerModal").classList.remove("hidden");
      }

      function closeEditCustomer() {
        document.getElementById("editCustomerModal").classList.add("hidden");
      }

      function openDeleteCustomer(id) {
        deleteCustomerId = id;
        const customer = allCustomers.find((c) => c.id === id);
        document.getElementById("deleteCustomerMsg").textContent =
          `Delete customer "${customer ? customer.name : id}"? This cannot be undone.`;
        document
          .getElementById("deleteCustomerModal")
          .classList.remove("hidden");
      }

      function closeDeleteCustomer() {
        document.getElementById("deleteCustomerModal").classList.add("hidden");
        deleteCustomerId = null;
      }

      async function confirmDeleteCustomer() {
        if (!deleteCustomerId) return;
        try {
          await fetchWithAuth(`/users/${deleteCustomerId}`, {
            method: "DELETE",
          });
          closeDeleteCustomer();
          await loadCustomers();
          showMessage("Customer deleted successfully.", "success");
        } catch (error) {
          closeDeleteCustomer();
          showMessage("Delete failed: " + error.message, "error");
        }
      }

      document
        .getElementById("editCustomerForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const id = document.getElementById("editCustomerId").value;
          const payload = {
            name: document.getElementById("editCustomerName").value.trim(),
            contact: document
              .getElementById("editCustomerContact")
              .value.trim(),
            address: document
              .getElementById("editCustomerAddress")
              .value.trim(),
            province: document
              .getElementById("editCustomerProvince")
              .value.trim(),
            city: document.getElementById("editCustomerCity").value.trim(),
            postalCode: document
              .getElementById("editCustomerPostal")
              .value.trim(),
            preference: document.getElementById("editCustomerPreference").value,
          };
          try {
            await fetchWithAuth(`/users/${id}`, {
              method: "PUT",
              body: JSON.stringify(payload),
            });
            closeEditCustomer();
            await loadCustomers();
            showMessage("Customer updated successfully.", "success");
          } catch (error) {
            showMessage("Update failed: " + error.message, "error");
          }
        });

      document.addEventListener("DOMContentLoaded", loadCustomers);
    </script>
  </body>
</html>
